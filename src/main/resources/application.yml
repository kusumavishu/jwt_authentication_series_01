spring:
  application:
    name: jwt-authentication-series-01

#  datasource:
#    url: jdbc:postgresql://localhost:5432/spring-supabase
#    username: postgres
#    password: root
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: ${APP_ADMIN_USERNAME}
      password: ${APP_ADMIN_PASSWORD}
#      password: $2a$10$6FX174LqAKNmIbUtz03Fd.wYgP2OSuaI/87F2TubRaosSlwcCnfA6

  main:
    banner-mode: off

  # servlet:
  #   multipart:
  #     max-file-size: 10MB
  #     max-request-size: 10MB

  # mail:
  #   host: smtp.gmail.com
  #   port: 587
  #   username:
  #   password:

  # profiles:
  #   active: dev

server:
  port: 7000
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param   # never | always | on_param
    include-exception: false
  # servlet:
  #   context-path: /v1

management:
  endpoints:
    web:
      base-path: /manage
      exposure:
        include: "*"
        exclude: health

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

logging:
  level:
    root: ${LOG_LEVEL:info}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:warn}

jwt:
  secret: JWT_KEY_FOR_springboot_with_supabase_ON_DD28MM06YYYY2026
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

